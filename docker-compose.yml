# Docker Compose local do produto — só Postgres.
# Não confundir com infra/evolution/ ou infra/stack/ (operação da agência,
# infraestrutura separada). Uso: dev local do apps/web + apps/worker + packages/db.
#
# apps/web e apps/worker rodam no HOST em dev (pnpm dev / pnpm worker), como a
# Fase 1 já faz com o web — só o Postgres vive no Docker. pg-boss (do worker) cria
# seu próprio schema neste mesmo Postgres (Fase 2, ADR-0009). A containerização de
# produção do produto é assunto de deploy, fora desta change.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blademidia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blademidia_dev}
      POSTGRES_DB: blademidia
    ports:
      - "5432:5432"
    volumes:
      - blademidia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blademidia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blademidia_postgres_data:
