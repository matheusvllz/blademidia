# Variante LOCAL (dev na máquina do operador) — sem Caddy/TLS, porta 8080 direta.
# Webhook aponta para o webhook-server rodando no host (node automation/webhook-server.mjs).
# Uso: docker compose -f docker-compose.local.yml --env-file .env up -d
services:
  evolution-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution-local}
      POSTGRES_DB: evolution
    volumes:
      - evolution_local_pg:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - evolution_local_redis:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-local-dev-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution-local}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:3333/webhooks/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_local_instances:/evolution/instances
    ports:
      - "8080:8080"

volumes:
  evolution_local_pg:
  evolution_local_redis:
  evolution_local_instances:
